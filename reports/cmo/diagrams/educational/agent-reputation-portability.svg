<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Inter', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#0A0E1F"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#635BFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#635BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="600" cy="360" r="380" fill="url(#glow)"/>

  <text x="600" y="80" fill="#635BFF" font-size="18" font-weight="600" letter-spacing="4" text-anchor="middle">REPUTATION PORTABILITY</text>
  <text x="600" y="140" fill="#F8F8F4" font-size="52" font-weight="800" letter-spacing="-1.5" text-anchor="middle">Your agent's reputation outlives the platform.</text>
  <text x="600" y="184" fill="#F8F8F4" fill-opacity="0.55" font-size="22" text-anchor="middle">Built on open protocols (SCORE + DRS) — not locked in a private database.</text>

  <!-- Agent (center top) -->
  <g transform="translate(490, 230)">
    <rect width="220" height="120" rx="14" fill="#635BFF" fill-opacity="0.14" stroke="#635BFF" stroke-width="2"/>
    <text x="110" y="38" fill="#635BFF" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">YOUR AGENT</text>
    <text x="110" y="74" fill="#F8F8F4" font-size="22" font-weight="700" text-anchor="middle">SCORE: 0.94</text>
    <text x="110" y="100" fill="#F8F8F4" fill-opacity="0.65" font-size="13" font-family="'JetBrains Mono', monospace" text-anchor="middle">accrued over 412 mandates</text>
  </g>

  <!-- Three platforms below -->
  <g transform="translate(110, 440)">
    <rect width="260" height="100" rx="12" fill="#0F1428" stroke="#F8F8F4" stroke-opacity="0.18" stroke-width="1.5"/>
    <text x="130" y="32" fill="#F8F8F4" fill-opacity="0.65" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PLATFORM A</text>
    <text x="130" y="62" fill="#F8F8F4" font-size="22" font-weight="700" text-anchor="middle">reads 0.94 ✓</text>
    <text x="130" y="82" fill="#F8F8F4" fill-opacity="0.5" font-size="12" text-anchor="middle">today</text>
  </g>

  <g transform="translate(470, 440)">
    <rect width="260" height="100" rx="12" fill="#0F1428" stroke="#F8F8F4" stroke-opacity="0.18" stroke-width="1.5"/>
    <text x="130" y="32" fill="#F8F8F4" fill-opacity="0.65" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PLATFORM B</text>
    <text x="130" y="62" fill="#F8F8F4" font-size="22" font-weight="700" text-anchor="middle">reads 0.94 ✓</text>
    <text x="130" y="82" fill="#F8F8F4" fill-opacity="0.5" font-size="12" text-anchor="middle">+ 6 months later</text>
  </g>

  <g transform="translate(830, 440)">
    <rect width="260" height="100" rx="12" fill="#0F1428" stroke="#F8F8F4" stroke-opacity="0.18" stroke-width="1.5"/>
    <text x="130" y="32" fill="#F8F8F4" fill-opacity="0.65" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PLATFORM C (NEW)</text>
    <text x="130" y="62" fill="#F8F8F4" font-size="22" font-weight="700" text-anchor="middle">reads 0.94 ✓</text>
    <text x="130" y="82" fill="#F8F8F4" fill-opacity="0.5" font-size="12" text-anchor="middle">never met your agent before</text>
  </g>

  <!-- connectors -->
  <line x1="540" y1="355" x2="240" y2="435" stroke="#F8F8F4" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="600" y1="355" x2="600" y2="435" stroke="#F8F8F4" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="660" y1="355" x2="960" y2="435" stroke="#F8F8F4" stroke-opacity="0.35" stroke-width="2"/>

  <text x="600" y="615" fill="#F8F8F4" fill-opacity="0.45" font-size="16" font-family="'JetBrains Mono', monospace" text-anchor="middle">SCORE on chain · DRS receipts portable · platform-independent</text>
  <text x="600" y="642" fill="#635BFF" fill-opacity="0.7" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">INVOICA · @godman-protocols/score</text>
</svg>
