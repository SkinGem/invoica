<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Inter', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#0A0E1F"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#635BFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#635BFF" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#635BFF"/>
    </marker>
  </defs>
  <circle cx="600" cy="360" r="380" fill="url(#glow)"/>

  <text x="600" y="80" fill="#635BFF" font-size="18" font-weight="600" letter-spacing="4" text-anchor="middle">DISCOVER → CONTRACT</text>
  <text x="600" y="140" fill="#F8F8F4" font-size="56" font-weight="800" letter-spacing="-1.5" text-anchor="middle">Two open layers. Not competing — composing.</text>
  <text x="600" y="184" fill="#F8F8F4" fill-opacity="0.55" font-size="22" text-anchor="middle">Discover with AgentCash. Contract with PACT. Anchor with DRS.</text>

  <!-- Step 1: Discover -->
  <g transform="translate(80, 290)">
    <rect width="460" height="200" rx="16" fill="#0F1428" stroke="#F8F8F4" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="46" cy="46" r="22" fill="#635BFF" fill-opacity="0.15" stroke="#635BFF" stroke-width="1.5"/>
    <text x="46" y="52" fill="#635BFF" font-size="20" font-weight="800" text-anchor="middle">1</text>
    <text x="86" y="50" fill="#635BFF" font-size="13" font-weight="700" letter-spacing="3">DISCOVER</text>
    <text x="40" y="100" fill="#F8F8F4" font-size="32" font-weight="700">AgentCash</text>
    <text x="40" y="132" fill="#F8F8F4" fill-opacity="0.65" font-size="16">"find a payable agent for task X"</text>
    <text x="40" y="166" fill="#F8F8F4" fill-opacity="0.5" font-size="14" font-family="'JetBrains Mono', monospace">IETF draft · Tempo + Merit</text>
  </g>

  <!-- arrow -->
  <line x1="555" y1="390" x2="645" y2="390" stroke="#635BFF" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Contract -->
  <g transform="translate(660, 290)">
    <rect width="460" height="200" rx="16" fill="#635BFF" fill-opacity="0.10" stroke="#635BFF" stroke-width="2"/>
    <circle cx="46" cy="46" r="22" fill="#635BFF" fill-opacity="0.25" stroke="#635BFF" stroke-width="1.5"/>
    <text x="46" y="52" fill="#F8F8F4" font-size="20" font-weight="800" text-anchor="middle">2</text>
    <text x="86" y="50" fill="#635BFF" font-size="13" font-weight="700" letter-spacing="3">CONTRACT</text>
    <text x="40" y="100" fill="#F8F8F4" font-size="32" font-weight="700">PACT</text>
    <text x="40" y="132" fill="#F8F8F4" fill-opacity="0.65" font-size="16">"sign the mandate · anchor on chain"</text>
    <text x="40" y="166" fill="#F8F8F4" fill-opacity="0.5" font-size="14" font-family="'JetBrains Mono', monospace">@godman-protocols/pact · v0.1 closed beta</text>
  </g>

  <!-- bottom: anchor row -->
  <g transform="translate(370, 530)">
    <rect width="460" height="56" rx="12" fill="#0F1428" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="230" y="36" fill="#10B981" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">+ DRS receipt · on-chain · verifiable years later</text>
  </g>

  <text x="600" y="623" fill="#F8F8F4" fill-opacity="0.45" font-size="14" font-family="'JetBrains Mono', monospace" text-anchor="middle">npmjs.com/org/godman-protocols</text>
  <text x="600" y="647" fill="#635BFF" fill-opacity="0.7" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">INVOICA · open agent stack</text>
</svg>
