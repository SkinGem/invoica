<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Inter', system-ui, sans-serif">
  <!-- background -->
  <rect width="1200" height="675" fill="#0A0E1F"/>

  <!-- ambient purple glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#635BFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#635BFF" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#635BFF"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#F8F8F4" fill-opacity="0.7"/>
    </marker>
  </defs>
  <circle cx="600" cy="340" r="380" fill="url(#glow)"/>

  <!-- eyebrow -->
  <text x="600" y="80" fill="#635BFF" font-size="18" font-weight="600" letter-spacing="4" text-anchor="middle">SIGNED MANDATES</text>

  <!-- title -->
  <text x="600" y="140" fill="#F8F8F4" font-size="56" font-weight="800" letter-spacing="-1.5" text-anchor="middle">Two agents. One signed agreement.</text>

  <!-- subtitle -->
  <text x="600" y="184" fill="#F8F8F4" fill-opacity="0.55" font-size="22" text-anchor="middle">PACT mandate · hash-anchored on chain · verifiable years later</text>

  <!-- Agent A (proposer) box -->
  <g transform="translate(80, 280)">
    <rect width="260" height="120" rx="14" fill="#0F1428" stroke="#635BFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="20" y="36" fill="#635BFF" font-size="13" font-weight="600" letter-spacing="3">PROPOSER</text>
    <text x="20" y="74" fill="#F8F8F4" font-size="30" font-weight="700">Agent A</text>
    <text x="20" y="102" fill="#F8F8F4" fill-opacity="0.55" font-size="14" font-family="'JetBrains Mono', monospace">did:pact:0x7a…</text>
  </g>

  <!-- Agent B (counterparty) box -->
  <g transform="translate(860, 280)">
    <rect width="260" height="120" rx="14" fill="#0F1428" stroke="#635BFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="20" y="36" fill="#635BFF" font-size="13" font-weight="600" letter-spacing="3">COUNTERPARTY</text>
    <text x="20" y="74" fill="#F8F8F4" font-size="30" font-weight="700">Agent B</text>
    <text x="20" y="102" fill="#F8F8F4" fill-opacity="0.55" font-size="14" font-family="'JetBrains Mono', monospace">did:pact:0xb3…</text>
  </g>

  <!-- central mandate -->
  <g transform="translate(440, 270)">
    <rect width="320" height="140" rx="16" fill="#635BFF" fill-opacity="0.12" stroke="#635BFF" stroke-width="2"/>
    <text x="160" y="42" fill="#635BFF" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">PACT MANDATE</text>
    <text x="160" y="80" fill="#F8F8F4" font-size="28" font-weight="700" text-anchor="middle">scope · terms · expiry</text>
    <text x="160" y="118" fill="#F8F8F4" fill-opacity="0.65" font-size="14" font-family="'JetBrains Mono', monospace" text-anchor="middle">mnd_6ed0f9a2…</text>
  </g>

  <!-- arrow A -> mandate -->
  <line x1="345" y1="340" x2="430" y2="340" stroke="#F8F8F4" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowSoft)"/>
  <text x="387" y="324" fill="#F8F8F4" fill-opacity="0.6" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">SIGN</text>

  <!-- arrow B -> mandate -->
  <line x1="855" y1="340" x2="770" y2="340" stroke="#F8F8F4" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrowSoft)"/>
  <text x="813" y="324" fill="#F8F8F4" fill-opacity="0.6" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">SIGN</text>

  <!-- below: on-chain anchor -->
  <g transform="translate(440, 470)">
    <rect width="320" height="76" rx="12" fill="#0F1428" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="160" y="32" fill="#10B981" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">ANCHORED ON CHAIN</text>
    <text x="160" y="58" fill="#F8F8F4" font-size="16" font-family="'JetBrains Mono', monospace" text-anchor="middle">0xdd9fe230… · Base Sepolia · block 1234567</text>
  </g>
  <line x1="600" y1="410" x2="600" y2="465" stroke="#635BFF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="600" y="615" fill="#F8F8F4" fill-opacity="0.45" font-size="16" font-family="'JetBrains Mono', monospace" text-anchor="middle">v0.1 HMAC · v0.2 EIP-712 · github.com/Godman-s/pact</text>
  <text x="600" y="642" fill="#635BFF" fill-opacity="0.7" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">INVOICA · @godman-protocols/pact</text>
</svg>
