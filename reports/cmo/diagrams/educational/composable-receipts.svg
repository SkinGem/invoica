<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Inter', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#0A0E1F"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#635BFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#635BFF" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#F8F8F4" fill-opacity="0.7"/>
    </marker>
  </defs>
  <circle cx="600" cy="360" r="380" fill="url(#glow)"/>

  <text x="600" y="80" fill="#635BFF" font-size="18" font-weight="600" letter-spacing="4" text-anchor="middle">COMPOSABLE RECEIPTS</text>
  <text x="600" y="140" fill="#F8F8F4" font-size="56" font-weight="800" letter-spacing="-1.5" text-anchor="middle">One receipt. Many protocols can read it.</text>
  <text x="600" y="184" fill="#F8F8F4" fill-opacity="0.55" font-size="22" text-anchor="middle">DRS = the atomic unit linking PACT, BOND, SCORE, partner reputation</text>

  <!-- center: receipt -->
  <g transform="translate(450, 320)">
    <rect width="300" height="130" rx="16" fill="#635BFF" fill-opacity="0.14" stroke="#635BFF" stroke-width="2"/>
    <text x="150" y="40" fill="#635BFF" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">DRS RECEIPT</text>
    <text x="150" y="78" fill="#F8F8F4" font-size="22" font-weight="700" font-family="'JetBrains Mono', monospace" text-anchor="middle">0xdd9fe230…</text>
    <text x="150" y="108" fill="#F8F8F4" fill-opacity="0.65" font-size="14" text-anchor="middle">on-chain · signed · timestamped</text>
  </g>

  <!-- 4 satellites: PACT (top), BOND (left), SCORE (right), Audit (bottom) -->
  <g transform="translate(490, 220)">
    <rect width="220" height="64" rx="12" fill="#0F1428" stroke="#F8F8F4" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="110" y="28" fill="#635BFF" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">PACT MANDATE</text>
    <text x="110" y="50" fill="#F8F8F4" font-size="15" text-anchor="middle">"this is what we agreed"</text>
  </g>

  <g transform="translate(140, 360)">
    <rect width="220" height="64" rx="12" fill="#0F1428" stroke="#F8F8F4" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="110" y="28" fill="#635BFF" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">BOND SUBSCRIPTION</text>
    <text x="110" y="50" fill="#F8F8F4" font-size="15" text-anchor="middle">"this is a recurring fee"</text>
  </g>

  <g transform="translate(840, 360)">
    <rect width="220" height="64" rx="12" fill="#0F1428" stroke="#F8F8F4" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="110" y="28" fill="#635BFF" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">SCORE REPUTATION</text>
    <text x="110" y="50" fill="#F8F8F4" font-size="15" text-anchor="middle">"this lifted the score"</text>
  </g>

  <g transform="translate(490, 490)">
    <rect width="220" height="64" rx="12" fill="#0F1428" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="110" y="28" fill="#10B981" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">COMPLIANCE AUDIT</text>
    <text x="110" y="50" fill="#F8F8F4" font-size="15" text-anchor="middle">"verifiable years later"</text>
  </g>

  <!-- connectors (4 arrows pointing IN to receipt) -->
  <line x1="600" y1="290" x2="600" y2="316" stroke="#F8F8F4" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="365" y1="385" x2="445" y2="385" stroke="#F8F8F4" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="835" y1="385" x2="755" y2="385" stroke="#F8F8F4" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="600" y1="455" x2="600" y2="485" stroke="#F8F8F4" stroke-opacity="0.5" stroke-width="2"/>

  <text x="600" y="615" fill="#F8F8F4" fill-opacity="0.45" font-size="16" font-family="'JetBrains Mono', monospace" text-anchor="middle">on-chain · audit-grade · npmjs.com/package/@godman-protocols/drs</text>
  <text x="600" y="642" fill="#635BFF" fill-opacity="0.7" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">INVOICA · @godman-protocols/drs</text>
</svg>
