<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Inter', system-ui, sans-serif">
  <rect width="1200" height="675" fill="#0A0E1F"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#635BFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#635BFF" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#F43F5E" fill-opacity="0.8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#10B981"/>
    </marker>
  </defs>
  <circle cx="600" cy="360" r="380" fill="url(#glow)"/>

  <text x="600" y="80" fill="#635BFF" font-size="18" font-weight="600" letter-spacing="4" text-anchor="middle">GASLESS MICROCOMMERCE</text>
  <text x="600" y="140" fill="#F8F8F4" font-size="56" font-weight="800" letter-spacing="-1.5" text-anchor="middle">10¢ payments shouldn't cost $5 in gas.</text>
  <text x="600" y="184" fill="#F8F8F4" fill-opacity="0.55" font-size="22" text-anchor="middle">SKALE Base: ~1 second flip · $0 fees · USDC.e settlement</text>

  <!-- Old (left column) -->
  <g transform="translate(80, 260)">
    <rect width="500" height="240" rx="16" fill="#0F1428" stroke="#F43F5E" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="250" y="40" fill="#F43F5E" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">BEFORE — TYPICAL L1/L2</text>
    <text x="60" y="84" fill="#F8F8F4" font-size="20" font-weight="700">Agent A</text>
    <text x="380" y="84" fill="#F8F8F4" font-size="20" font-weight="700">Agent B</text>
    <line x1="140" y1="80" x2="370" y2="80" stroke="#F8F8F4" stroke-opacity="0.55" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="250" y="124" fill="#F8F8F4" font-size="18" font-family="'JetBrains Mono', monospace" text-anchor="middle">$0.10 USDC</text>
    <text x="250" y="152" fill="#F43F5E" font-size="20" font-weight="700" text-anchor="middle">+ $3-15 gas</text>
    <text x="250" y="186" fill="#F8F8F4" fill-opacity="0.5" font-size="14" text-anchor="middle">economics: broken at micropayment scale</text>
    <text x="250" y="214" fill="#F8F8F4" fill-opacity="0.5" font-size="14" text-anchor="middle">latency: 10-60 seconds typical</text>
  </g>

  <!-- New (right column) -->
  <g transform="translate(620, 260)">
    <rect width="500" height="240" rx="16" fill="#0F1428" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="250" y="40" fill="#10B981" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">AFTER — SKALE BASE</text>
    <text x="60" y="84" fill="#F8F8F4" font-size="20" font-weight="700">Agent A</text>
    <text x="380" y="84" fill="#F8F8F4" font-size="20" font-weight="700">Agent B</text>
    <line x1="140" y1="80" x2="370" y2="80" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="250" y="124" fill="#F8F8F4" font-size="18" font-family="'JetBrains Mono', monospace" text-anchor="middle">$0.10 USDC.e</text>
    <text x="250" y="152" fill="#10B981" font-size="20" font-weight="700" text-anchor="middle">+ $0.00 gas</text>
    <text x="250" y="186" fill="#F8F8F4" fill-opacity="0.65" font-size="14" text-anchor="middle">economics: agent commerce at scale</text>
    <text x="250" y="214" fill="#F8F8F4" fill-opacity="0.65" font-size="14" text-anchor="middle">latency: ~1 second flip post-detection</text>
  </g>

  <text x="600" y="615" fill="#F8F8F4" fill-opacity="0.45" font-size="16" font-family="'JetBrains Mono', monospace" text-anchor="middle">live demo: invoica.ai/supported-chains · settlement watcher detects in 15-25s</text>
  <text x="600" y="642" fill="#635BFF" fill-opacity="0.7" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">INVOICA · SKALE Base</text>
</svg>
